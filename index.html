      .navigation{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,0.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);contain:layout style paint;content-visibility:auto}

    <!-- Optimized performance monitoring - Mobile LCP focused -->
    <script>
      // Mobile performance optimization - DOMContentLoaded for faster execution
      window.addEventListener('DOMContentLoaded', function() {
        // Apply performance containment to images for faster rendering
        const images = document.querySelectorAll('img');
        images.forEach(img => {
          if (!img.style.contain) {
            img.style.contain = 'size layout style';
          }
          // Ensure proper aspect ratios to prevent layout shifts
          if (!img.width && !img.height) {
            img.loading = 'lazy';
          }
        });
        
        // Preload next hero image for carousel performance
        const nextHeroImage = new Image();
        nextHeroImage.src = '/images/rubber-matting-hero-mobile-hq.webp';
      });
      
      // Minimal error handling - suppresses non-critical console errors
      window.addEventListener('error', function(e) {
        if (e.error && (e.error.name === 'ResizeObserver' || e.error.name === 'ChunkLoadError' || e.message?.includes('ResizeObserver'))) {
          e.preventDefault();
          return false;
        }
      }, true);
    </script>
